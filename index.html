<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Portafolios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#0d1117;--card:#161b22;--card2:#1c2129;--line:#21262d;--line2:#30363d;
  --txt:#e6edf3;--txt2:#8b949e;--txt3:#6e7681;
  --acc:#ff7a1a;--acc2:#3d2408;
  --grn:#3fb950;--grn2:#0f2916;--red:#f85149;--red2:#2b1010;--amb:#d29922;
  --mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5}
button{font-family:var(--sans)}
.hidden{display:none!important}

/* Topbar */
.top{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.logo{width:34px;height:34px;background:var(--acc);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#0d1117;font-size:16px}
.brand{font-size:15px;font-weight:700;letter-spacing:-.02em}
.spacer{flex:1}
.sel,.inp{background:var(--bg);border:1px solid var(--line2);color:var(--txt);border-radius:8px;padding:8px 12px;font-size:13px;font-family:var(--sans)}
.sel:focus,.inp:focus{outline:none;border-color:var(--acc)}
.pf-sel{min-width:190px;font-weight:600}
.status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt2);font-family:var(--mono)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--txt3)}
.dot.ok{background:var(--grn)}.dot.warn{background:var(--amb)}.dot.old{background:var(--red)}

.btn{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line2);background:transparent;color:var(--txt2)}
.btn:hover{color:var(--txt);border-color:var(--txt3)}
.btn-p{background:var(--acc);border-color:var(--acc);color:#0d1117}
.btn-p:hover{filter:brightness(1.08);color:#0d1117}
.btn-sm{padding:5px 10px;font-size:12px}
.icon-btn{padding:8px 10px}

.wrap{padding:24px;max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi-l{font-size:11px;color:var(--txt3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.kpi-v{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.01em}
.kpi-s{font-family:var(--mono);font-size:12px;margin-top:4px}
.pos{color:var(--grn)}.neg{color:var(--red)}

/* Cards + charts */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-h .spacer{flex:1}
.chart-box{padding:18px;height:280px}

/* Tables */
table{width:100%;border-collapse:collapse}
th{text-align:right;font-size:11px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
th:first-child{text-align:left}
th:hover{color:var(--txt)}
th.sorted{color:var(--acc)}
td{text-align:right;padding:11px 16px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px;white-space:nowrap}
td:first-child{text-align:left;font-family:var(--sans);font-weight:600}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--card2)}
.tag{display:inline-block;font-size:11px;font-family:var(--sans);font-weight:600;padding:2px 8px;border-radius:5px}
.tag-b{background:var(--grn2);color:var(--grn)}
.tag-s{background:var(--red2);color:var(--red)}
.del{color:var(--txt3);cursor:pointer;font-family:var(--sans)}
.del:hover{color:var(--red)}
.empty{padding:36px 16px;text-align:center;color:var(--txt2);font-size:13px}
.pend{color:var(--amb)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:var(--card);border:1px solid var(--line2);border-radius:14px;width:100%;max-width:460px;padding:22px}
.modal h3{font-size:16px;margin-bottom:16px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:var(--txt2);margin-bottom:5px}
.field .inp,.field .sel{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.pf-live{font-size:11px;color:var(--txt3);margin-top:5px;font-family:var(--mono)}

/* Config gate */
.gate{max-width:520px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
.gate h2{font-size:17px;margin-bottom:6px}
.gate p{font-size:13px;color:var(--txt2);margin-bottom:14px}
textarea{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--line2);border-radius:8px;color:var(--txt);font-family:var(--mono);font-size:12px;padding:12px;resize:vertical}
textarea:focus{outline:none;border-color:var(--acc)}
.err{color:var(--red);font-size:12px;margin-top:10px;font-family:var(--mono)}
</style>
</head>
<body>

<!-- ══════════ PUERTA DE CONFIGURACIÓN ══════════ -->
<div id="gate" class="gate">
  <h2>Conecta tu Firebase (TANMMS)</h2>
  <p>Pega el mismo objeto <span style="font-family:var(--mono)">firebaseConfig</span> de tu proyecto de TANMMS. Se guarda solo en este navegador.</p>
  <textarea id="cfgInput" placeholder='{ "apiKey": "...", "projectId": "...", "appId": "..." }'></textarea>
  <div style="margin-top:12px"><button class="btn btn-p" onclick="conectar()">Conectar</button></div>
  <div class="err" id="cfgErr"></div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="app" class="hidden">
  <div class="top">
    <div class="logo">$</div>
    <div class="brand">Portafolios</div>
    <select class="sel pf-sel" id="pfSel" onchange="cambiarPortafolio(this.value)"></select>
    <button class="btn btn-sm icon-btn" title="Nuevo portafolio" onclick="nuevoPortafolio()">+ Nuevo</button>
    <button class="btn btn-sm icon-btn" title="Renombrar" onclick="renombrarPortafolio()">Renombrar</button>
    <button class="btn btn-sm icon-btn" title="Eliminar" onclick="eliminarPortafolio()">Eliminar</button>
    <div class="spacer"></div>
    <div class="status"><span class="dot" id="pxDot"></span><span id="pxTxt">precios…</span></div>
    <label style="font-size:12px;color:var(--txt2)">Divisa</label>
    <select class="sel" id="divSel" onchange="setDivisa(this.value)">
      <option value="MXN">MXN</option><option value="USD">USD</option><option value="EUR">EUR</option>
    </select>
    <button class="btn btn-p" onclick="abrirOrden()">+ Orden</button>
  </div>

  <div id="banner" class="hidden" style="background:var(--red2);color:var(--red);border-bottom:1px solid var(--red);padding:10px 24px;font-size:13px;font-family:var(--mono)"></div>

  <div class="wrap">
    <!-- KPIs -->
    <div class="kpis" id="kpis"></div>

    <!-- Charts -->
    <div class="grid2">
      <div class="card"><div class="card-h">Distribución por activo</div><div class="chart-box"><canvas id="chActivo"></canvas></div></div>
      <div class="card"><div class="card-h">Distribución por divisa</div><div class="chart-box"><canvas id="chDiv"></canvas></div></div>
    </div>

    <!-- Posiciones abiertas -->
    <div class="card">
      <div class="card-h">Posiciones abiertas <span class="spacer"></span></div>
      <table id="tAbiertas"></table>
    </div>

    <!-- Posiciones cerradas -->
    <div class="card">
      <div class="card-h">Posiciones cerradas</div>
      <table id="tCerradas"></table>
    </div>

    <!-- Órdenes -->
    <div class="card">
      <div class="card-h">Órdenes</div>
      <table id="tOrdenes"></table>
    </div>
  </div>
</div>

<!-- ══════════ MODAL ORDEN ══════════ -->
<div id="ovOrden" class="overlay hidden">
  <div class="modal">
    <h3>Nueva orden</h3>
    <div class="row2">
      <div class="field"><label>Fecha</label><input type="date" class="inp" id="oFecha"></div>
      <div class="field"><label>Tipo</label><select class="sel" id="oTipo"><option value="compra">Compra</option><option value="venta">Venta</option></select></div>
    </div>
    <div class="field"><label>Ticker</label><input class="inp" id="oTicker" placeholder="AAPL" oninput="this.value=this.value.toUpperCase()" onblur="prefillPrecio()"><div class="pf-live" id="oLive"></div></div>
    <div class="row2">
      <div class="field"><label>Cantidad</label><input type="number" step="any" class="inp" id="oCant" placeholder="0"></div>
      <div class="field"><label>Precio</label><input type="number" step="any" class="inp" id="oPrecio" placeholder="0.00"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Comisión</label><input type="number" step="any" class="inp" id="oComision" placeholder="0.00" value="0"></div>
      <div class="field"><label>Divisa</label><select class="sel" id="oDivisa"><option>USD</option><option>MXN</option><option>EUR</option></select></div>
    </div>
    <div class="err" id="oErr"></div>
    <div class="modal-foot">
      <button class="btn" onclick="cerrarOrden()">Cancelar</button>
      <button class="btn btn-p" onclick="guardarOrden()">Agregar orden</button>
    </div>
  </div>
</div>

<script>
/* ═════════════ ESTADO ═════════════ */
var db=null, EST={portafolios:{},activo:null}, PRECIOS={precios:{},fx:{}};
var _unsubEst=null,_unsubPx=null,_saveT=null,_lastHash='';
var CFG_KEY='cpt_dash_cfg', DIV_KEY='cpt_dash_div';
var divisaVista=localStorage.getItem(DIV_KEY)||'MXN';
var sortAb={k:'valor',d:-1}, sortCe={k:'realizado',d:-1}, sortOr={k:'fecha',d:-1};
var chActivo=null, chDiv=null;

/* ═════════════ CONEXIÓN ═════════════ */
window.addEventListener('load',function(){
  document.getElementById('oFecha').value=new Date().toISOString().slice(0,10);
  document.getElementById('divSel').value=divisaVista;
  var s=localStorage.getItem(CFG_KEY);
  if(s){document.getElementById('cfgInput').value=s;conectar();}
  setInterval(pintarEstadoPrecios,20000);
});

function parseCfg(t){try{return JSON.parse(t);}catch(e){try{return(new Function('return ('+t+')'))();}catch(e2){return null;}}}

function conectar(){
  var err=document.getElementById('cfgErr');err.textContent='';
  var cfg=parseCfg(document.getElementById('cfgInput').value.trim());
  if(!cfg||!cfg.apiKey){err.textContent='No se pudo leer la config. Pega el objeto completo.';return;}
  try{
    if(!firebase.apps.length)firebase.initializeApp(cfg);else firebase.app();
    db=firebase.firestore();
    localStorage.setItem(CFG_KEY,JSON.stringify(cfg));
  }catch(e){err.textContent='Error al iniciar Firebase: '+e.message;return;}
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  escuchar();
}

function escuchar(){
  // Estado de la app (portafolios + órdenes)
  if(_unsubEst)_unsubEst();
  _unsubEst=db.collection('app').doc('estado').onSnapshot(function(snap){
    if(snap.exists){
      var r=snap.data(); if(JSON.stringify(r)===_lastHash)return;
      EST={portafolios:r.portafolios||{},activo:r.activo||null};
      normalizar();
    }else{ EST={portafolios:{},activo:null}; }
    if(!EST.activo||!EST.portafolios[EST.activo]){
      var ks=Object.keys(EST.portafolios); EST.activo=ks[0]||null;
    }
    render();
  },function(e){banner('Error al leer app/estado: '+e.message+' — revisa las reglas de Firestore.');});
  // Precios en vivo (del recolector)
  if(_unsubPx)_unsubPx();
  _unsubPx=db.collection('precios_live').doc('latest').onSnapshot(function(snap){
    if(snap.exists){PRECIOS=snap.data()||{precios:{},fx:{}};}
    pintarEstadoPrecios(); render();
  },function(){setPx('old','sin precios');});
}

function normalizar(){
  for(var id in EST.portafolios){var p=EST.portafolios[id]; if(!Array.isArray(p.ordenes))p.ordenes=[];}
}

/* ═════════════ PUBLICAR TICKERS (para el recolector) ═════════════ */
// Junta todos los tickers de TODOS los portafolios y los deja en
// precios_config/tickers. El recolector los lee y baja sus precios solo.
var _lastTickers='';
function publicarTickers(){
  if(!db)return;
  var set={};
  for(var id in EST.portafolios){
    (EST.portafolios[id].ordenes||[]).forEach(function(o){if(o.ticker)set[o.ticker]=1;});
  }
  var arr=Object.keys(set).sort();
  var h=arr.join(',');
  if(h===_lastTickers)return;   // solo escribe si cambió la lista
  _lastTickers=h;
  db.collection('precios_config').doc('tickers').set({lista:arr}).catch(function(){});
}

/* ═════════════ GUARDAR ═════════════ */
function guardar(){
  render();
  if(!db)return;
  clearTimeout(_saveT);
  _saveT=setTimeout(function(){
    var payload={portafolios:EST.portafolios,activo:EST.activo};
    _lastHash=JSON.stringify(payload);
    db.collection('app').doc('estado').set(payload)
      .then(function(){hideBanner();})
      .catch(function(e){banner('No se pudo guardar: '+e.message+' — falta permiso de ESCRITURA en app/estado en las reglas de Firestore.');});
  },400);
}

/* ═════════════ PORTAFOLIOS ═════════════ */
function slug(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||('pf_'+Date.now());}

function nuevoPortafolio(){
  var n=prompt('Nombre del portafolio (ej. TANMMS, Portafolio de Vale):'); if(!n)return;
  var d=prompt('Divisa base del portafolio (USD, MXN o EUR):','USD'); d=(d||'USD').toUpperCase();
  var id=slug(n); if(EST.portafolios[id]){alert('Ya existe un portafolio con ese nombre.');return;}
  EST.portafolios[id]={nombre:n,divisaBase:d,ordenes:[]};
  EST.activo=id; divisaVista=d; localStorage.setItem(DIV_KEY,d); document.getElementById('divSel').value=d;
  guardar();
}
function renombrarPortafolio(){
  var p=EST.portafolios[EST.activo]; if(!p)return;
  var n=prompt('Nuevo nombre:',p.nombre); if(!n)return; p.nombre=n; guardar();
}
function eliminarPortafolio(){
  var p=EST.portafolios[EST.activo]; if(!p)return;
  if(!confirm('¿Eliminar "'+p.nombre+'" y todas sus órdenes? Esto no se puede deshacer.'))return;
  delete EST.portafolios[EST.activo];
  EST.activo=Object.keys(EST.portafolios)[0]||null; guardar();
}
function cambiarPortafolio(id){
  EST.activo=id;
  var p=EST.portafolios[id];
  if(p&&p.divisaBase){divisaVista=p.divisaBase;localStorage.setItem(DIV_KEY,divisaVista);document.getElementById('divSel').value=divisaVista;}
  guardar();
}
function setDivisa(d){divisaVista=d;localStorage.setItem(DIV_KEY,d);render();}

/* ═════════════ ÓRDENES ═════════════ */
function abrirOrden(){
  if(!EST.activo){alert('Primero crea un portafolio.');return;}
  document.getElementById('oErr').textContent='';
  document.getElementById('ovOrden').classList.remove('hidden');
}
function cerrarOrden(){document.getElementById('ovOrden').classList.add('hidden');}
function prefillPrecio(){
  var t=document.getElementById('oTicker').value.trim().toUpperCase();
  var q=PRECIOS.precios&&PRECIOS.precios[t];
  var live=document.getElementById('oLive');
  if(q){
    if(!document.getElementById('oPrecio').value)document.getElementById('oPrecio').value=q.precio;
    if(q.moneda)document.getElementById('oDivisa').value=q.moneda;
    live.textContent='Precio en vivo: '+fmt(q.precio)+' '+(q.moneda||'');
  }else{live.textContent=t?('Sin precio en vivo para '+t+' (agrégalo al recolector).'):'';}
}
function guardarOrden(){
  var o={
    id:'o'+Date.now()+Math.floor(Math.random()*1000),
    fecha:document.getElementById('oFecha').value,
    tipo:document.getElementById('oTipo').value,
    ticker:document.getElementById('oTicker').value.trim().toUpperCase(),
    cantidad:parseFloat(document.getElementById('oCant').value),
    precio:parseFloat(document.getElementById('oPrecio').value),
    comision:parseFloat(document.getElementById('oComision').value)||0,
    divisa:document.getElementById('oDivisa').value
  };
  var err=document.getElementById('oErr');
  if(!o.fecha||!o.ticker||!(o.cantidad>0)||!(o.precio>=0)){err.textContent='Revisa fecha, ticker, cantidad y precio.';return;}
  EST.portafolios[EST.activo].ordenes.push(o);
  cerrarOrden();
  document.getElementById('oTicker').value='';document.getElementById('oCant').value='';document.getElementById('oPrecio').value='';document.getElementById('oComision').value='0';document.getElementById('oLive').textContent='';
  guardar();
}
function borrarOrden(id){
  if(!confirm('¿Borrar esta orden?'))return;
  var p=EST.portafolios[EST.activo];
  p.ordenes=p.ordenes.filter(function(o){return o.id!==id;});
  guardar();
}

/* ═════════════ DIVISAS ═════════════ */
function toMXN(a,ccy){var fx=PRECIOS.fx||{};if(ccy==='MXN')return a;if(ccy==='USD')return fx.USDMXN?a*fx.USDMXN:null;if(ccy==='EUR')return fx.EURMXN?a*fx.EURMXN:null;return null;}
function fromMXN(a,ccy){var fx=PRECIOS.fx||{};if(ccy==='MXN')return a;if(ccy==='USD')return fx.USDMXN?a/fx.USDMXN:null;if(ccy==='EUR')return fx.EURMXN?a/fx.EURMXN:null;return null;}
function conv(a,from,to){if(a==null)return null;var m=toMXN(a,from);if(m==null)return null;return fromMXN(m,to);}

/* ═════════════ MOTOR DE CÁLCULO ═════════════ */
function calcular(p){
  var ord=(p.ordenes||[]).slice().sort(function(a,b){return (a.fecha+a.id)<(b.fecha+b.id)?-1:1;});
  var pos={};
  ord.forEach(function(o){
    if(!pos[o.ticker])pos[o.ticker]={ticker:o.ticker,qty:0,costo:0,divisa:o.divisa,realizado:0};
    var P=pos[o.ticker];
    if(o.tipo==='compra'){
      P.costo+=o.cantidad*o.precio+o.comision; P.qty+=o.cantidad;
    }else{
      var avg=P.qty>0?P.costo/P.qty:0;
      P.realizado+=o.cantidad*(o.precio-avg)-o.comision;
      P.costo-=avg*o.cantidad; P.qty-=o.cantidad;
      if(P.qty<1e-9){P.qty=0;P.costo=0;}
    }
    P.divisa=o.divisa||P.divisa;
  });
  var abiertas=[],cerradas=[];
  for(var t in pos){
    var P=pos[t];
    var q=PRECIOS.precios&&PRECIOS.precios[t];
    var ccyMercado=(q&&q.moneda)||P.divisa;
    if(P.qty>0){
      var avg=P.costo/P.qty;
      var precioAct=q?q.precio:null;
      var valor=precioAct!=null?P.qty*precioAct:null;
      var noReal=valor!=null?valor-P.costo:null;
      abiertas.push({ticker:t,qty:P.qty,avg:avg,precio:precioAct,costo:P.costo,valor:valor,noReal:noReal,pct:(noReal!=null&&P.costo>0)?noReal/P.costo*100:null,divisa:ccyMercado});
    }
    if(Math.abs(P.realizado)>1e-9&&P.qty<=0){
      cerradas.push({ticker:t,realizado:P.realizado,divisa:P.divisa});
    }else if(Math.abs(P.realizado)>1e-9){
      cerradas.push({ticker:t,realizado:P.realizado,divisa:P.divisa});
    }
  }
  return {abiertas:abiertas,cerradas:cerradas,ordenes:ord};
}

/* ═════════════ RENDER ═════════════ */
function render(){
  // Dropdown de portafolios
  var sel=document.getElementById('pfSel');
  var ids=Object.keys(EST.portafolios);
  sel.innerHTML=ids.length?ids.map(function(id){return '<option value="'+id+'"'+(id===EST.activo?' selected':'')+'>'+esc(EST.portafolios[id].nombre)+'</option>';}).join(''):'<option value="">— sin portafolios —</option>';

  publicarTickers();

  var p=EST.portafolios[EST.activo];
  if(!p){renderVacio();return;}
  var C=calcular(p), D=divisaVista;

  // KPIs (en divisa de vista)
  var valorMkt=0,costo=0,realizado=0,hayPend=false;
  C.abiertas.forEach(function(a){
    var cC=conv(a.costo,a.divisa,D); if(cC!=null)costo+=cC;
    if(a.valor!=null){var v=conv(a.valor,a.divisa,D); if(v!=null)valorMkt+=v; else hayPend=true;} else hayPend=true;
  });
  C.cerradas.forEach(function(c){var r=conv(c.realizado,c.divisa,D); if(r!=null)realizado+=r;});
  var noReal=valorMkt-costo, pct=costo>0?noReal/costo*100:0;

  document.getElementById('kpis').innerHTML=[
    kpi('Valor de mercado',money(valorMkt,D)+(hayPend?' <span class="pend">•</span>':'')),
    kpi('Costo invertido',money(costo,D)),
    kpi('P&L no realizado',money(noReal,D),pctTxt(pct),noReal>=0),
    kpi('P&L realizado',money(realizado,D),null,realizado>=0)
  ].join('');

  renderAbiertas(C.abiertas,D);
  renderCerradas(C.cerradas,D);
  renderOrdenes(C.ordenes);
  renderCharts(C.abiertas,D);
}

function renderVacio(){
  document.getElementById('kpis').innerHTML='';
  ['tAbiertas','tCerradas','tOrdenes'].forEach(function(id){document.getElementById(id).innerHTML='<tbody><tr><td class="empty">Crea un portafolio y agrega tu primera orden.</td></tr></tbody>';});
  if(chActivo){chActivo.destroy();chActivo=null;} if(chDiv){chDiv.destroy();chDiv=null;}
}

function kpi(l,v,s,pos){
  return '<div class="kpi"><div class="kpi-l">'+l+'</div><div class="kpi-v '+(pos===undefined?'':(pos?'pos':'neg'))+'">'+v+'</div>'+(s?'<div class="kpi-s '+(pos?'pos':'neg')+'">'+s+'</div>':'')+'</div>';
}

function renderAbiertas(rows,D){
  rows.sort(sorter(sortAb));
  var t=document.getElementById('tAbiertas');
  var head='<thead><tr>'+th('Ticker','ticker',sortAb)+th('Cant.','qty',sortAb)+th('Costo prom.','avg',sortAb)+th('Precio actual','precio',sortAb)+th('Valor ('+D+')','valor',sortAb)+th('P&L no real.','noReal',sortAb)+th('%','pct',sortAb)+'</tr></thead>';
  if(!rows.length){t.innerHTML=head+'<tbody><tr><td class="empty" colspan="7">Sin posiciones abiertas.</td></tr></tbody>';return;}
  var body=rows.map(function(a){
    var valorD=a.valor!=null?conv(a.valor,a.divisa,D):null;
    var noRealD=a.noReal!=null?conv(a.noReal,a.divisa,D):null;
    return '<tr onclick="setSort(sortAb,\'\')" style="cursor:default">'+
      '<td>'+a.ticker+' <span style="color:var(--txt3);font-weight:400;font-size:11px">'+a.divisa+'</span></td>'+
      '<td>'+fmt(a.qty)+'</td>'+
      '<td>'+fmt(a.avg)+'</td>'+
      '<td>'+(a.precio!=null?fmt(a.precio):'<span class="pend">pendiente</span>')+'</td>'+
      '<td>'+(valorD!=null?money(valorD,D):'—')+'</td>'+
      cell(noRealD,money(noRealD,D))+
      cell(a.pct,pctTxt(a.pct))+
    '</tr>';
  }).join('');
  t.innerHTML=head+'<tbody>'+body+'</tbody>';
}

function renderCerradas(rows,D){
  rows.sort(sorter(sortCe));
  var t=document.getElementById('tCerradas');
  var head='<thead><tr>'+th('Ticker','ticker',sortCe)+th('P&L realizado ('+D+')','realizado',sortCe)+'</tr></thead>';
  if(!rows.length){t.innerHTML=head+'<tbody><tr><td class="empty" colspan="2">Sin posiciones cerradas todavía.</td></tr></tbody>';return;}
  var body=rows.map(function(c){
    var r=conv(c.realizado,c.divisa,D);
    return '<tr><td>'+c.ticker+'</td>'+cell(r,money(r,D))+'</tr>';
  }).join('');
  t.innerHTML=head+'<tbody>'+body+'</tbody>';
}

function renderOrdenes(rows){
  rows.sort(sorter(sortOr));
  var t=document.getElementById('tOrdenes');
  var head='<thead><tr>'+th('Fecha','fecha',sortOr)+th('Ticker','ticker',sortOr)+th('Tipo','tipo',sortOr)+th('Cant.','cantidad',sortOr)+th('Precio','precio',sortOr)+th('Comisión','comision',sortOr)+th('Divisa','divisa',sortOr)+'<th></th></tr></thead>';
  if(!rows.length){t.innerHTML=head+'<tbody><tr><td class="empty" colspan="8">Sin órdenes. Usa "+ Orden" para agregar la primera.</td></tr></tbody>';return;}
  var body=rows.slice().reverse().map(function(o){
    return '<tr><td>'+o.fecha+'</td><td>'+o.ticker+'</td>'+
      '<td><span class="tag '+(o.tipo==='compra'?'tag-b':'tag-s')+'">'+(o.tipo==='compra'?'Compra':'Venta')+'</span></td>'+
      '<td>'+fmt(o.cantidad)+'</td><td>'+fmt(o.precio)+'</td><td>'+fmt(o.comision)+'</td><td>'+o.divisa+'</td>'+
      '<td><span class="del" onclick="borrarOrden(\''+o.id+'\')">borrar</span></td></tr>';
  }).join('');
  t.innerHTML=head+'<tbody>'+body+'</tbody>';
}

/* ═════════════ CHARTS ═════════════ */
function renderCharts(abiertas,D){
  var porActivo={},porDiv={};
  abiertas.forEach(function(a){
    var v=a.valor!=null?conv(a.valor,a.divisa,D):null; if(v==null||v<=0)return;
    porActivo[a.ticker]=(porActivo[a.ticker]||0)+v;
    porDiv[a.divisa]=(porDiv[a.divisa]||0)+v;
  });
  chActivo=doughnut('chActivo',chActivo,porActivo);
  chDiv=doughnut('chDiv',chDiv,porDiv);
}
var PAL=['#ff7a1a','#3fb950','#58a6ff','#d29922','#bc8cff','#f85149','#39c5cf','#db61a2','#a5d6a7','#f0883e'];
function doughnut(canvasId,inst,map){
  if(inst){inst.destroy();}
  var labels=Object.keys(map).sort(function(a,b){return map[b]-map[a];});
  var data=labels.map(function(l){return map[l];});
  var ctx=document.getElementById(canvasId).getContext('2d');
  if(!labels.length){return new Chart(ctx,{type:'doughnut',data:{labels:['Sin datos'],datasets:[{data:[1],backgroundColor:['#21262d'],borderWidth:0}]},options:{plugins:{legend:{display:false}},cutout:'62%'}});}
  return new Chart(ctx,{type:'doughnut',data:{labels:labels,datasets:[{data:data,backgroundColor:PAL,borderColor:'#161b22',borderWidth:2}]},
    options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'right',labels:{color:'#8b949e',font:{family:'Inter',size:12},boxWidth:10,padding:10}},
      tooltip:{callbacks:{label:function(c){var tot=data.reduce(function(x,y){return x+y;},0);var pc=tot?(c.parsed/tot*100).toFixed(1):0;return ' '+c.label+': '+pc+'%';}}}}}});
}

/* ═════════════ ORDENAMIENTO ═════════════ */
function th(label,key,st){return '<th class="'+(st.k===key?'sorted':'')+'" onclick="setSort(\''+(st===sortAb?'ab':st===sortCe?'ce':'or')+'\',\''+key+'\')">'+label+(st.k===key?(st.d>0?' ↑':' ↓'):'')+'</th>';}
function setSort(which,key){
  var st=which==='ab'?sortAb:which==='ce'?sortCe:sortOr;
  if(!key)return;
  if(st.k===key)st.d*=-1;else{st.k=key;st.d=1;}
  render();
}
function sorter(st){return function(a,b){var x=a[st.k],y=b[st.k];if(x==null)x=-Infinity;if(y==null)y=-Infinity;if(typeof x==='string'){return x<y?-1*st.d:x>y?st.d:0;}return (x-y)*st.d;};}

/* ═════════════ PRECIOS: ESTADO ═════════════ */
function pintarEstadoPrecios(){
  if(!PRECIOS.epoch){setPx('warn','sin precios aún');return;}
  var min=Math.round((Date.now()-PRECIOS.epoch)/60000);
  if(min<20)setPx('ok','precios hace '+min+' min');
  else if(min<60)setPx('warn','precios hace '+min+' min');
  else setPx('old','precios hace '+min+' min');
}
function setPx(s,t){document.getElementById('pxDot').className='dot '+s;document.getElementById('pxTxt').textContent=t;}

/* ═════════════ UTILIDADES ═════════════ */
function fmt(n){return(typeof n==='number'&&isFinite(n))?n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}):(n==null?'—':n);}
function money(n,d){if(n==null||!isFinite(n))return'—';return n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+d;}
function pctTxt(p){if(p==null||!isFinite(p))return'—';return(p>=0?'+':'')+p.toFixed(2)+'%';}
function cell(val,txt){if(val==null||!isFinite(val))return'<td>—</td>';return '<td class="'+(val>=0?'pos':'neg')+'">'+txt+'</td>';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function banner(m){var b=document.getElementById('banner');if(!b)return;b.textContent=m;b.classList.remove('hidden');}
function hideBanner(){var b=document.getElementById('banner');if(b)b.classList.add('hidden');}
</script>
