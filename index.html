<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Portafolios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#0a1f2b;--panel:#0f2a3a;--panel2:#143a54;--line:#21455f;--line2:#2c536e;
  --txt:#e8eef3;--txt2:#9db3c6;--txt3:#6b869b;
  --acc:#6ba3d6;--acc2:#143a54;--grn:#4cc38a;--grn2:#12332a;--red:#e5675b;--red2:#3a1f1f;--amb:#d9a441;
  --mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5}
button{font-family:var(--sans)}
.hidden{display:none!important}
.pos{color:var(--grn)}.neg{color:var(--red)}.pend{color:var(--amb)}
.spacer{flex:1}

/* Topbar */
.top{display:flex;align-items:center;gap:22px;padding:0 26px;height:60px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.logo{width:34px;height:34px;background:linear-gradient(135deg,#6ba3d6,#8b7fe0);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#0a1f2b;font-size:17px}
.navtabs{display:flex;gap:4px}
.navtab{padding:8px 14px;border-radius:8px;border:none;background:none;color:var(--txt2);font-size:14px;font-weight:600;cursor:pointer}
.navtab:hover{color:var(--txt)}
.navtab.active{background:var(--panel2);color:var(--txt)}
.sel{background:var(--bg);border:1px solid var(--line2);color:var(--txt);border-radius:8px;padding:7px 12px;font-size:13px;font-family:var(--sans)}
.sel:focus{outline:none;border-color:var(--acc)}
.pf-sel{font-weight:600;min-width:150px}
.status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--txt3);font-family:var(--mono)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--txt3)}
.dot.ok{background:var(--grn)}.dot.warn{background:var(--amb)}.dot.old{background:var(--red)}
.btn{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line2);background:transparent;color:var(--txt2)}
.btn:hover{color:var(--txt);border-color:var(--txt3)}
.btn-p{background:var(--acc);border-color:var(--acc);color:#0a1f2b}.btn-p:hover{filter:brightness(1.08);color:#0a1f2b}
.btn-sm{padding:5px 10px;font-size:12px}

.wrap{max-width:1240px;margin:0 auto;padding:24px 26px 60px}
.banner{background:var(--red2);color:var(--red);border-bottom:1px solid var(--red);padding:10px 26px;font-size:13px;font-family:var(--mono)}

/* Sub-tabs */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;border-bottom:1px solid var(--line)}
.subtab{padding:10px 4px;margin-right:16px;border:none;background:none;color:var(--txt2);font-size:14px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
.subtab:hover{color:var(--txt)}
.subtab.active{color:var(--acc);border-bottom-color:var(--acc)}
.page-t{font-size:19px;font-weight:700;letter-spacing:-.02em}
.page-d{font-size:13px;color:var(--txt2);margin:4px 0 16px}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.kpi-l{font-size:12px;color:var(--txt2);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.kpi-i{width:22px;height:22px;border-radius:6px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:12px}
.kpi-v{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.02em}
.kpi-s{font-family:var(--mono);font-size:12px;color:var(--txt3);margin-top:5px}

.cashbar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 20px;margin-bottom:20px;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--txt2)}
.cashbar b{color:var(--txt);font-family:var(--mono)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:20px}
.card-h{padding:15px 20px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}

/* Holdings table */
table{width:100%;border-collapse:collapse}
th{text-align:right;font-size:11px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
th:first-child{text-align:left}
th:hover{color:var(--txt)}th.sorted{color:var(--acc)}
td{text-align:right;padding:12px 16px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:13px;white-space:nowrap;vertical-align:middle}
td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--panel2)}
td .sub{font-size:11px;color:var(--txt3);font-family:var(--mono);margin-top:2px}
td.txtcell{font-family:var(--sans);font-size:12.5px;color:var(--txt2)}
.hcell{display:flex;align-items:center;gap:11px}
.av{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.hn{font-family:var(--sans);font-weight:600;font-size:13px}
.ht{font-size:11px;color:var(--txt3);font-family:var(--mono);margin-top:1px}
.tag{display:inline-block;font-size:11px;font-family:var(--sans);font-weight:600;padding:2px 8px;border-radius:5px}
.tag-b{background:var(--grn2);color:var(--grn)}.tag-s{background:var(--red2);color:var(--red)}
.del{color:var(--txt3);cursor:pointer;font-family:var(--sans)}.del:hover{color:var(--red)}
.empty{padding:44px 16px;text-align:center;color:var(--txt2);font-size:13px}
.gate-msg{background:var(--panel);border:1px dashed var(--line2);border-radius:14px;padding:34px;text-align:center;color:var(--txt2);font-size:13px}
.gate-msg b{color:var(--txt)}

/* Movers */
.mv{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--line)}
.mv:last-child{border-bottom:none}
.mv-l{display:flex;align-items:center;gap:11px}
.mv-t{font-weight:600;font-size:13px}.mv-n{font-size:11px;color:var(--txt3);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv-p{font-family:var(--mono);font-size:13px;text-align:right}
.mv-ch{font-family:var(--mono);font-size:12px;margin-top:1px;text-align:right}

/* Donut + legend */
.donutrow{display:flex;gap:24px;padding:20px;align-items:center}
@media(max-width:820px){.donutrow{flex-direction:column}}
.chartbox{position:relative;height:280px;width:280px;flex-shrink:0}
.chartbox.wide{width:100%;height:320px}
.leglist{flex:1;width:100%;min-width:0}
.legrow{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.legrow:last-child{border-bottom:none}
.legdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.legname{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legpct{font-family:var(--mono);font-weight:600}
.legval{font-family:var(--mono);color:var(--txt3);width:110px;text-align:right}

.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.pill{padding:6px 12px;border-radius:20px;border:1px solid var(--line2);background:transparent;color:var(--txt2);font-size:12px;font-weight:600;cursor:pointer}
.pill:hover{color:var(--txt)}.pill.active{background:var(--acc);border-color:var(--acc);color:#0a1f2b}
.ahead{background:var(--panel2);border-radius:10px;padding:12px 16px;font-size:13px;margin-bottom:14px}

.field{margin-bottom:13px}.field label{display:block;font-size:12px;color:var(--txt2);margin-bottom:5px}
.inp{background:var(--bg);border:1px solid var(--line2);color:var(--txt);border-radius:8px;padding:8px 12px;font-size:13px;font-family:var(--sans)}
.inp:focus{outline:none;border-color:var(--acc)}
.field .inp,.field .sel{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:100%;max-width:460px;padding:22px}
.modal h3{font-size:16px;margin-bottom:16px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.err{color:var(--red);font-size:12px;margin-top:8px;font-family:var(--mono)}
.pf-live{font-size:11px;color:var(--txt3);margin-top:5px;font-family:var(--mono)}

.gate{max-width:520px;margin:60px auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}
.gate h2{font-size:17px;margin-bottom:6px}.gate p{font-size:13px;color:var(--txt2);margin-bottom:14px}
textarea{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--line2);border-radius:8px;color:var(--txt);font-family:var(--mono);font-size:12px;padding:12px;resize:vertical}
textarea:focus{outline:none;border-color:var(--acc)}
</style>
</head>
<body>

<!-- ══════════ PUERTA DE CONFIG ══════════ -->
<div id="gate" class="gate">
  <h2>Conecta tu Firebase (TANMMS)</h2>
  <p>Pega el mismo objeto <span style="font-family:var(--mono)">firebaseConfig</span> de tu proyecto de TANMMS. Se guarda solo en este navegador.</p>
  <textarea id="cfgInput" placeholder='{ "apiKey": "...", "projectId": "...", "appId": "..." }'></textarea>
  <div style="margin-top:12px"><button class="btn btn-p" onclick="conectar()">Conectar</button></div>
  <div class="err" id="cfgErr"></div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="app" class="hidden">
  <div class="top">
    <div class="logo">S</div>
    <div class="navtabs">
      <button class="navtab active" data-p="dashboard" onclick="go('dashboard')">Dashboard</button>
      <button class="navtab" data-p="analytics" onclick="go('analytics')">Analytics</button>
      <button class="navtab" data-p="portfolio" onclick="go('portfolio')">Portfolio</button>
      <button class="navtab" data-p="tools" onclick="go('tools')">Tools</button>
    </div>
    <div class="spacer"></div>
    <div class="status"><span class="dot" id="pxDot"></span><span id="pxTxt">precios…</span></div>
    <select class="sel pf-sel" id="pfSel" onchange="cambiarPortafolio(this.value)"></select>
    <select class="sel" id="divSel" onchange="setDivisa(this.value)"><option>MXN</option><option>USD</option><option>EUR</option></select>
    <button class="btn btn-p" onclick="abrirOrden()">+ Add</button>
  </div>
  <div id="banner" class="banner hidden"></div>
  <div class="wrap"><div id="pageBody"></div></div>
</div>

<!-- ══════════ MODAL ORDEN ══════════ -->
<div id="ovOrden" class="overlay hidden">
  <div class="modal">
    <h3>Nueva orden</h3>
    <div class="row2">
      <div class="field"><label>Fecha</label><input type="date" class="inp" id="oFecha"></div>
      <div class="field"><label>Tipo</label><select class="sel" id="oTipo"><option value="compra">Compra</option><option value="venta">Venta</option></select></div>
    </div>
    <div class="field"><label>Ticker</label><input class="inp" id="oTicker" placeholder="AAPL" oninput="this.value=this.value.toUpperCase()" onblur="prefillPrecio()"><div class="pf-live" id="oLive"></div></div>
    <div class="row2">
      <div class="field"><label>Cantidad</label><input type="number" step="any" class="inp" id="oCant" placeholder="0"></div>
      <div class="field"><label>Precio</label><input type="number" step="any" class="inp" id="oPrecio" placeholder="0.00"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Comisión</label><input type="number" step="any" class="inp" id="oComision" value="0"></div>
      <div class="field"><label>Divisa</label><select class="sel" id="oDivisa"><option>USD</option><option>MXN</option><option>EUR</option></select></div>
    </div>
    <div class="err" id="oErr"></div>
    <div class="modal-foot"><button class="btn" onclick="cerrarOrden()">Cancelar</button><button class="btn btn-p" onclick="guardarOrden()">Agregar orden</button></div>
  </div>
</div>

<script>
/* ═════════════ ESTADO ═════════════ */
var db=null, EST={portafolios:{},activo:null}, PRECIOS={precios:{},fx:{}}, HIST={serie:{},fx:{}}, META={}, DIVID={};
var IMPPREV={ordenes:[],depositos:[]};
var _uE=null,_uP=null,_uH=null,_uM=null,_uD=null,_saveT=null,_lastHash='',_lastTickers='';
var CFG_KEY='cpt_dash_cfg', DIV_KEY='cpt_dash_div';
var divisaVista=localStorage.getItem(DIV_KEY)||'MXN';
var PAGE='dashboard', SUB='common', PORTTAB='holdings', TOOL='importar', DIVAXIS='activo';
var PERIODO='3M', BENCH={sym:'^GSPC',label:'S&P 500'}, RANGO={desde:'',hasta:''};
var sortAb={k:'valor',d:-1}, sortOr={k:'fecha',d:-1};
var CHARTS={};
var PAL=['#6ba3d6','#4cc38a','#8b7fe0','#39c5cf','#d9a441','#e5675b','#b48ee0','#7fc4d6','#5bd6b0','#93aeca','#c98fd6','#3e6089'];

window.addEventListener('load',function(){
  document.getElementById('oFecha').value=new Date().toISOString().slice(0,10);
  document.getElementById('divSel').value=divisaVista;
  var s=localStorage.getItem(CFG_KEY); if(s){document.getElementById('cfgInput').value=s;conectar();}
  setInterval(pintarEstadoPrecios,20000);
});

/* ═════════════ CONEXIÓN ═════════════ */
function parseCfg(t){try{return JSON.parse(t);}catch(e){try{return(new Function('return ('+t+')'))();}catch(e2){return null;}}}
function conectar(){
  var err=document.getElementById('cfgErr');err.textContent='';
  var cfg=parseCfg(document.getElementById('cfgInput').value.trim());
  if(!cfg||!cfg.apiKey){err.textContent='No se pudo leer la config. Pega el objeto completo.';return;}
  try{ if(!firebase.apps.length)firebase.initializeApp(cfg);else firebase.app(); db=firebase.firestore(); localStorage.setItem(CFG_KEY,JSON.stringify(cfg)); }
  catch(e){err.textContent='Error al iniciar Firebase: '+e.message;return;}
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  escuchar(); go('dashboard');
}
function escuchar(){
  if(_uE)_uE();
  _uE=db.collection('app').doc('estado').onSnapshot(function(snap){
    if(snap.exists){var r=snap.data(); if(JSON.stringify(r)!==_lastHash){EST={portafolios:r.portafolios||{},activo:r.activo||null};normalizar();}}
    else{EST={portafolios:{},activo:null};}
    if(!EST.activo||!EST.portafolios[EST.activo]){EST.activo=Object.keys(EST.portafolios)[0]||null;}
    render();
  },function(e){banner('Error al leer app/estado: '+e.message+' — revisa las reglas de Firestore.');});
  if(_uP)_uP();
  _uP=db.collection('precios_live').doc('latest').onSnapshot(function(s){if(s.exists)PRECIOS=s.data()||{precios:{},fx:{}};pintarEstadoPrecios();render();},function(){setPx('old','sin precios');});
  if(_uH)_uH();
  _uH=db.collection('precios_hist').doc('serie').onSnapshot(function(s){if(s.exists){var d=s.data();HIST={serie:d.serie||{},fx:d.fx||{}};}render();},function(){});
  if(_uM)_uM();
  _uM=db.collection('precios_config').doc('meta').onSnapshot(function(s){if(s.exists){META=(s.data()||{}).items||{};}render();},function(){});
  if(_uD)_uD();
  _uD=db.collection('precios_config').doc('dividendos').onSnapshot(function(s){if(s.exists){DIVID=(s.data()||{}).items||{};}render();},function(){});
}
function normalizar(){for(var id in EST.portafolios){var p=EST.portafolios[id];if(!Array.isArray(p.ordenes))p.ordenes=[];}}
function reconectar(){if(_uE)_uE();if(_uP)_uP();if(_uH)_uH();if(_uM)_uM();if(_uD)_uD();localStorage.removeItem(CFG_KEY);document.getElementById('app').classList.add('hidden');document.getElementById('gate').classList.remove('hidden');}

/* ═════════════ GUARDAR ═════════════ */
function publicarTickers(){
  if(!db)return;var set={};
  for(var id in EST.portafolios)(EST.portafolios[id].ordenes||[]).forEach(function(o){if(o.ticker)set[o.ticker]=1;});
  var arr=Object.keys(set).sort(),h=arr.join(',');
  if(h===_lastTickers)return;_lastTickers=h;
  db.collection('precios_config').doc('tickers').set({lista:arr}).catch(function(){});
}
function guardar(){
  render();
  if(!db)return;
  clearTimeout(_saveT);
  _saveT=setTimeout(function(){
    var payload={portafolios:EST.portafolios,activo:EST.activo};
    _lastHash=JSON.stringify(payload);
    db.collection('app').doc('estado').set(payload).then(hideBanner).catch(function(e){banner('No se pudo guardar: '+e.message+' — falta permiso de ESCRITURA en app/estado en las reglas.');});
  },400);
}

/* ═════════════ PORTAFOLIOS / ÓRDENES ═════════════ */
function slug(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||('pf_'+Date.now());}
function nuevoPortafolio(){
  var n=prompt('Nombre del portafolio (ej. TANMMS, Portafolio de Vale):');if(!n)return;
  var d=(prompt('Divisa base (USD, MXN o EUR):','USD')||'USD').toUpperCase();
  var id=slug(n);if(EST.portafolios[id]){alert('Ya existe uno con ese nombre.');return;}
  EST.portafolios[id]={nombre:n,divisaBase:d,ordenes:[],tasaImpuesto:10};
  EST.activo=id;divisaVista=d;localStorage.setItem(DIV_KEY,d);document.getElementById('divSel').value=d;guardar();
}
function renombrarPortafolio(){var p=EST.portafolios[EST.activo];if(!p)return;var n=prompt('Nuevo nombre:',p.nombre);if(!n)return;p.nombre=n;guardar();}
function eliminarPortafolio(){var p=EST.portafolios[EST.activo];if(!p)return;if(!confirm('¿Eliminar "'+p.nombre+'" y todas sus órdenes?'))return;delete EST.portafolios[EST.activo];EST.activo=Object.keys(EST.portafolios)[0]||null;guardar();}
function cambiarPortafolio(id){EST.activo=id;var p=EST.portafolios[id];if(p&&p.divisaBase){divisaVista=p.divisaBase;localStorage.setItem(DIV_KEY,divisaVista);document.getElementById('divSel').value=divisaVista;}guardar();}
function setDivisa(d){divisaVista=d;localStorage.setItem(DIV_KEY,d);render();}
function abrirOrden(){if(!EST.activo){alert('Primero crea un portafolio.');return;}document.getElementById('oErr').textContent='';document.getElementById('ovOrden').classList.remove('hidden');}
function cerrarOrden(){document.getElementById('ovOrden').classList.add('hidden');}
function prefillPrecio(){
  var t=document.getElementById('oTicker').value.trim().toUpperCase();var q=PRECIOS.precios&&PRECIOS.precios[t];var live=document.getElementById('oLive');
  if(q){if(!document.getElementById('oPrecio').value)document.getElementById('oPrecio').value=q.precio;if(q.moneda)document.getElementById('oDivisa').value=q.moneda;live.textContent='Precio en vivo: '+fmt(q.precio)+' '+(q.moneda||'');}
  else{live.textContent=t?('Sin precio en vivo aún para '+t+'.'):'';}
}
function guardarOrden(){
  var o={id:'o'+Date.now()+Math.floor(Math.random()*1000),fecha:document.getElementById('oFecha').value,tipo:document.getElementById('oTipo').value,ticker:document.getElementById('oTicker').value.trim().toUpperCase(),cantidad:parseFloat(document.getElementById('oCant').value),precio:parseFloat(document.getElementById('oPrecio').value),comision:parseFloat(document.getElementById('oComision').value)||0,divisa:document.getElementById('oDivisa').value};
  var err=document.getElementById('oErr');
  if(!o.fecha||!o.ticker||!(o.cantidad>0)||!(o.precio>=0)){err.textContent='Revisa fecha, ticker, cantidad y precio.';return;}
  EST.portafolios[EST.activo].ordenes.push(o);cerrarOrden();
  ['oTicker','oCant','oPrecio'].forEach(function(i){document.getElementById(i).value='';});document.getElementById('oComision').value='0';document.getElementById('oLive').textContent='';
  guardar();
}
function borrarOrden(id){if(!confirm('¿Borrar esta orden?'))return;var p=EST.portafolios[EST.activo];p.ordenes=p.ordenes.filter(function(o){return o.id!==id;});guardar();}
function setTasa(v){var p=EST.portafolios[EST.activo];if(!p)return;p.tasaImpuesto=parseFloat(v)||0;guardar();}

/* ═════════════ DIVISAS / MOTOR ═════════════ */
function toMXN(a,ccy,fx){fx=fx||PRECIOS.fx||{};if(ccy==='MXN')return a;if(ccy==='USD')return fx.USDMXN?a*fx.USDMXN:null;if(ccy==='EUR')return fx.EURMXN?a*fx.EURMXN:null;return null;}
function fromMXN(a,ccy,fx){fx=fx||PRECIOS.fx||{};if(ccy==='MXN')return a;if(ccy==='USD')return fx.USDMXN?a/fx.USDMXN:null;if(ccy==='EUR')return fx.EURMXN?a/fx.EURMXN:null;return null;}
function conv(a,from,to){if(a==null)return null;var m=toMXN(a,from);if(m==null)return null;return fromMXN(m,to);}
function calcular(p){
  var ord=(p.ordenes||[]).slice().sort(function(a,b){return (a.fecha+a.id)<(b.fecha+b.id)?-1:1;});
  var pos={};
  ord.forEach(function(o){
    if(!pos[o.ticker])pos[o.ticker]={ticker:o.ticker,qty:0,costo:0,divisa:o.divisa,realizado:0};
    var P=pos[o.ticker];
    if(o.tipo==='compra'){P.costo+=o.cantidad*o.precio+o.comision;P.qty+=o.cantidad;}
    else{var avg=P.qty>0?P.costo/P.qty:0;P.realizado+=o.cantidad*(o.precio-avg)-o.comision;P.costo-=avg*o.cantidad;P.qty-=o.cantidad;if(P.qty<1e-9){P.qty=0;P.costo=0;}}
    P.divisa=o.divisa||P.divisa;
  });
  var abiertas=[],cerradas=[];
  for(var t in pos){
    var P=pos[t],q=PRECIOS.precios&&PRECIOS.precios[t],ccyM=(q&&q.moneda)||P.divisa;
    if(P.qty>0){var avg=P.costo/P.qty,pa=q?q.precio:null,val=pa!=null?P.qty*pa:null,nr=val!=null?val-P.costo:null;
      abiertas.push({ticker:t,qty:P.qty,avg:avg,precio:pa,costo:P.costo,valor:val,noReal:nr,pct:(nr!=null&&P.costo>0)?nr/P.costo*100:null,divisa:ccyM});}
    if(Math.abs(P.realizado)>1e-9)cerradas.push({ticker:t,realizado:P.realizado,divisa:P.divisa});
  }
  return {abiertas:abiertas,cerradas:cerradas,ordenes:ord};
}
function totales(C,D){
  var vm=0,co=0,re=0,pend=false;
  C.abiertas.forEach(function(a){var c=conv(a.costo,a.divisa,D);if(c!=null)co+=c;if(a.valor!=null){var v=conv(a.valor,a.divisa,D);if(v!=null)vm+=v;else pend=true;}else pend=true;});
  C.cerradas.forEach(function(c){var r=conv(c.realizado,c.divisa,D);if(r!=null)re+=r;});
  return {vm:vm,co:co,re:re,nr:vm-co,pct:co>0?(vm-co)/co*100:0,pend:pend};
}
function efectivo(p,D){
  if(!(p.flujos&&p.flujos.length))return 0;
  var cash=0;
  (p.flujos||[]).forEach(function(f){var m=conv(f.monto,f.divisa||'USD',D);if(m==null)return;if(f.tipo==='retiro')cash-=m;else cash+=m;});
  (p.ordenes||[]).forEach(function(o){var m=conv(o.cantidad*o.precio,o.divisa,D);if(m==null)return;var com=conv(o.comision||0,o.divisa,D)||0;if(o.tipo==='compra')cash-=(m+com);else cash+=(m-com);});
  return cash;
}
function xirr(fl){
  if(fl.length<2)return null;var t0=fl[0].fecha.getTime();
  function npv(r){var s=0;for(var i=0;i<fl.length;i++){var yr=(fl[i].fecha.getTime()-t0)/31557600000;s+=fl[i].monto/Math.pow(1+r,yr);}return s;}
  var lo=-0.999999,hi=100,flo=npv(lo),fhi=npv(hi);
  if(!isFinite(flo)||!isFinite(fhi)||flo*fhi>0)return null;
  var r=0;for(var i=0;i<200;i++){r=(lo+hi)/2;var f=npv(r);if(Math.abs(f)<1e-7)break;if(flo*f<0){hi=r;}else{lo=r;flo=f;}}
  return r;
}
function irr(p,D){
  var fl=[];
  (p.flujos||[]).forEach(function(f){var m=conv(f.monto,f.divisa||'USD',D);if(m==null)return;var signo=(f.tipo==='retiro')?1:-1;fl.push({fecha:new Date(f.fecha),monto:signo*m});});
  if(!fl.length)return null;
  var C=calcular(p),T=totales(C,D),cash=efectivo(p,D);
  fl.push({fecha:new Date(),monto:T.vm+cash});
  fl.sort(function(a,b){return a.fecha-b.fecha;});
  var r=xirr(fl);return r!=null?r*100:null;
}
function pasivo(C,D){var da=0;C.abiertas.forEach(function(a){var d=DIVID[a.ticker];if(d&&isFinite(d.tasaAnual)){var v=conv(a.qty*d.tasaAnual,a.divisa,D);if(v!=null)da+=v;}});return da;}
function dailyTotal(C,D){var s=0;C.abiertas.forEach(function(a){var q=PRECIOS.precios&&PRECIOS.precios[a.ticker];if(q&&q.prev!=null){var v=conv(a.qty*(q.precio-q.prev),a.divisa,D);if(v!=null)s+=v;}});return s;}

/* ═════════════ SERIE / PERIODO ═════════════ */
function cierre(serieT,d){if(!serieT)return null;if(serieT[d]!=null)return serieT[d];var ds=Object.keys(serieT).filter(function(x){return x<=d;}).sort();return ds.length?serieT[ds[ds.length-1]]:null;}
function fxOn(pair,d){var h=HIST.fx&&HIST.fx[pair];if(h){var v=cierre(h,d);if(v!=null)return v;}return (PRECIOS.fx&&PRECIOS.fx[pair])||null;}
function convHistTo(a,from,to,d){if(a==null)return null;var m;if(from==='MXN')m=a;else if(from==='USD'){var r=fxOn('USDMXN',d);m=r?a*r:null;}else if(from==='EUR'){var r2=fxOn('EURMXN',d);m=r2?a*r2:null;}else m=null;if(m==null)return null;if(to==='MXN')return m;if(to==='USD'){var r3=fxOn('USDMXN',d);return r3?m/r3:null;}if(to==='EUR'){var r4=fxOn('EURMXN',d);return r4?m/r4:null;}return null;}
function serieValor(p,D){
  var H=HIST.serie||{},fechas={};for(var t in H)for(var d in H[t])fechas[d]=1;
  var dias=Object.keys(fechas).sort();if(!dias.length)return [];
  var ord=(p.ordenes||[]).slice();
  return dias.map(function(d){
    var hold={},ccy={};
    ord.forEach(function(o){if(o.fecha<=d){hold[o.ticker]=(hold[o.ticker]||0)+(o.tipo==='compra'?o.cantidad:-o.cantidad);ccy[o.ticker]=o.divisa;}});
    var val=0,ok=false;
    for(var t in hold){if(hold[t]<=1e-9)continue;var pr=cierre(H[t],d);if(pr==null)continue;var mccy=(PRECIOS.precios[t]&&PRECIOS.precios[t].moneda)||ccy[t];var v=convHistTo(hold[t]*pr,mccy,D,d);if(v==null)continue;val+=v;ok=true;}
    return ok?{fecha:d,valor:val}:null;
  }).filter(Boolean);
}
function filtrarPeriodo(serie){
  if(!serie.length)return serie;
  if(PERIODO==='PERS'){var d=RANGO.desde||'0000-00-00',h=RANGO.hasta||'9999-99-99';return serie.filter(function(x){return x.fecha>=d&&x.fecha<=h;});}
  var hoy=serie[serie.length-1].fecha,ini,f=new Date(hoy);
  if(PERIODO==='7D')return serie.slice(-8);
  if(PERIODO==='1M')f.setMonth(f.getMonth()-1);
  else if(PERIODO==='3M')f.setMonth(f.getMonth()-3);
  else if(PERIODO==='6M')f.setMonth(f.getMonth()-6);
  else if(PERIODO==='1A')f.setFullYear(f.getFullYear()-1);
  else if(PERIODO==='YTD')f=new Date(hoy.slice(0,4)+'-01-01');
  else return serie;
  ini=f.toISOString().slice(0,10);
  return serie.filter(function(x){return x.fecha>=ini;});
}
function agrupar(C,D,eje){
  var m={};
  C.abiertas.forEach(function(a){
    var v=a.valor!=null?conv(a.valor,a.divisa,D):null;if(v==null||v<=0)return;
    var key;
    if(eje==='activo')key=a.ticker;
    else if(eje==='divisa')key=a.divisa;
    else if(eje==='sector')key=(META[a.ticker]&&META[a.ticker].sector)||'Sin dato';
    else if(eje==='pais')key=(META[a.ticker]&&META[a.ticker].pais)||'Sin dato';
    else if(eje==='dividendo'){var d=DIVID[a.ticker];if(d&&isFinite(d.tasaAnual)){var dv=conv(a.qty*d.tasaAnual,a.divisa,D);if(dv&&dv>0){m[a.ticker]=(m[a.ticker]||0)+dv;}}return;}
    m[key]=(m[key]||0)+v;
  });
  return m;
}

  else lineChart('growthLine',fechas,per.map(function(x){return x.valor;}),D);
}
function anMetrics(p,D,host){
  var serie=serieValor(p,D);
  if(serie.length<5){host.innerHTML='<div class="gate-msg"><b>Recopilando histórico…</b><br>La volatilidad, drawdown y VaR necesitan varios días de datos.</div>';return;}
  var rets=[];for(var i=1;i<serie.length;i++){var a=serie[i-1].valor,b=serie[i].valor;if(a>0)rets.push(b/a-1);}
  var media=rets.reduce(function(x,y){return x+y;},0)/rets.length;
  var varz=rets.reduce(function(x,y){return x+(y-media)*(y-media);},0)/rets.length;
  var volD=Math.sqrt(varz),volA=volD*Math.sqrt(252);
  var pico=-Infinity,maxdd=0;serie.forEach(function(x){if(x.valor>pico)pico=x.valor;var dd=pico>0?(x.valor/pico-1):0;if(dd<maxdd)maxdd=dd;});
  var valLast=serie[serie.length-1].valor,var95=1.645*volD*valLast;
  host.innerHTML='<div class="kpis">'+
    kpiCard('〜','Volatilidad anual',(volA*100).toFixed(2)+'%','')+
    kpiCard('▽','Máx. drawdown',(maxdd*100).toFixed(2)+'%','','neg')+
    kpiCard('!','VaR 95% (1 día)',money(var95,D),'≈ '+(1.645*volD*100).toFixed(2)+'%','neg')+
    kpiCard('#','Días de histórico',String(serie.length),'')+'</div><div class="page-d">VaR paramétrico (normal), sobre el histórico de valor.</div>';
}

function filasHoldings(C,D,total){

/* ═════════════ IMPORTAR ESTADO (GBM PDF) ═════════════ */
function firma(o){return o.fecha+'|'+o.ticker+'|'+o.tipo+'|'+(+o.cantidad).toFixed(6)+'|'+(+o.precio).toFixed(4);}
function parseEstado(texto){
  var lineas=texto.split(/\r?\n/), ordenes=[], depositos=[];
  lineas.forEach(function(l){
    var mo=l.match(/(\d{2})\/(\d{2})\/(\d{4}).*?\b(BUY|SELL)\b.*?TRD\s+([A-Z.]+)\s+(B|S)\s+([\d.]+)\s+at\s+([\d.]+)/);
    if(mo){ordenes.push({fecha:mo[3]+'-'+mo[1]+'-'+mo[2],tipo:(mo[4]==='BUY'?'compra':'venta'),ticker:mo[5].replace(/\.$/,''),cantidad:parseFloat(mo[7]),precio:parseFloat(mo[8]),divisa:'USD'});return;}
    var md=l.match(/(\d{2})\/(\d{2})\/(\d{4}).*?\bCDEP\b.*?([\d,]+\.\d{2})\s*$/);
    if(md){depositos.push({fecha:md[3]+'-'+md[1]+'-'+md[2],monto:parseFloat(md[4].replace(/,/g,''))});}
  });
  return {ordenes:ordenes,depositos:depositos};
}
function pdfTexto(buf){
  if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  return pdfjsLib.getDocument({data:buf}).promise.then(function(pdf){
    var tareas=[]; for(var pg=1;pg<=pdf.numPages;pg++)tareas.push(pdf.getPage(pg));
    return Promise.all(tareas).then(function(pages){
      return Promise.all(pages.map(function(p){return p.getTextContent();})).then(function(contents){
        var lineas=[];
        contents.forEach(function(tc){
          var byY={};
          tc.items.forEach(function(it){var yv=Math.round(it.transform[5]);(byY[yv]=byY[yv]||[]).push(it);});
          Object.keys(byY).map(Number).sort(function(a,b){return b-a;}).forEach(function(yv){
            var linea=byY[yv].sort(function(a,b){return a.transform[4]-b.transform[4];}).map(function(i){return i.str;}).join(' ').replace(/\s+/g,' ').trim();
            if(linea)lineas.push(linea);
          });
        });
        return lineas.join('\n');
      });
    });
  });
}
function onEstadoFile(input){
  var files=Array.prototype.slice.call(input.files); if(!files.length)return;
  document.getElementById('impStatus').textContent='Leyendo '+files.length+' archivo(s)…';
  var acumO=[],acumD=[];
  var cadena=files.reduce(function(prev,f){
    return prev.then(function(){return f.arrayBuffer();}).then(pdfTexto).then(function(t){var r=parseEstado(t);acumO=acumO.concat(r.ordenes);acumD=acumD.concat(r.depositos);}).catch(function(){});
  },Promise.resolve());
  cadena.then(function(){IMPPREV={ordenes:acumO,depositos:acumD};render();});
}
function toolImportar(p){
  var html='<div class="page-t">Importar estado de cuenta</div><div class="page-d">Carga tus PDF de GBM: detecta compras, ventas y depósitos, y omite lo ya cargado.</div>';
  html+='<div class="card" style="max-width:640px"><div class="card-h">Cargar PDF(s) de GBM</div><div style="padding:16px 20px"><input type="file" accept="application/pdf" multiple onchange="onEstadoFile(this)" class="inp" style="width:100%"><div class="pf-live" id="impStatus" style="margin-top:8px"></div></div></div>';
  var exist={}; (p.ordenes||[]).forEach(function(o){exist[firma(o)]=1;});
  var nuevas=IMPPREV.ordenes.filter(function(o){return !exist[firma(o)];}),dupes=IMPPREV.ordenes.length-nuevas.length;
  var existF={}; (p.flujos||[]).forEach(function(f){existF[f.fecha+'|'+f.monto]=1;});
  var nuevosDep=IMPPREV.depositos.filter(function(d){return !existF[d.fecha+'|'+d.monto];});
  if(IMPPREV.ordenes.length||IMPPREV.depositos.length){
    html+='<div class="card"><div class="card-h">Órdenes detectadas: '+nuevas.length+' nuevas'+(dupes?(' · '+dupes+' ya estaban'):'')+'<span class="spacer"></span>'+(nuevas.length?'<button class="btn btn-sm btn-p" onclick="importarOrdenes()">Importar '+nuevas.length+'</button>':'')+'</div>';
    if(nuevas.length)html+='<table><thead><tr><th>Fecha</th><th>Ticker</th><th>Tipo</th><th>Cant.</th><th>Precio</th></tr></thead><tbody>'+nuevas.map(function(o){return '<tr><td>'+o.fecha+'</td><td>'+o.ticker+'</td><td><span class="tag '+(o.tipo==='compra'?'tag-b':'tag-s')+'">'+(o.tipo==='compra'?'Compra':'Venta')+'</span></td><td>'+fmt(o.cantidad)+'</td><td>'+fmt(o.precio)+'</td></tr>';}).join('')+'</tbody></table>';
    else html+='<div class="empty">Todas las órdenes de estos PDF ya estaban cargadas.</div>';
    html+='</div>';
    if(nuevosDep.length)html+='<div class="card"><div class="card-h">Depósitos detectados: '+nuevosDep.length+'<span class="spacer"></span><button class="btn btn-sm" onclick="importarDepositos()">Registrar</button></div><table><thead><tr><th>Fecha</th><th>Monto (USD)</th></tr></thead><tbody>'+nuevosDep.map(function(d){return '<tr><td>'+d.fecha+'</td><td>'+money(d.monto,'USD')+'</td></tr>';}).join('')+'</tbody></table></div>';
  }
  return html;
}
function importarOrdenes(){
  var p=EST.portafolios[EST.activo],exist={},n=0; (p.ordenes||[]).forEach(function(o){exist[firma(o)]=1;});
  IMPPREV.ordenes.forEach(function(o){var f=firma(o);if(exist[f])return;p.ordenes.push({id:'o'+Date.now()+Math.floor(Math.random()*1e6),fecha:o.fecha,tipo:o.tipo,ticker:o.ticker,cantidad:o.cantidad,precio:o.precio,comision:0,divisa:o.divisa});exist[f]=1;n++;});

function importarDepositos(){

function chartImagen(cfg,w,h){
  return new Promise(function(res){
    var c=document.createElement('canvas');c.width=w;c.height=h;c.style.position='fixed';c.style.left='-10000px';c.style.top='0';c.style.width=w+'px';c.style.height=h+'px';
    document.body.appendChild(c);
    var ch=new Chart(c.getContext('2d'),cfg);
    setTimeout(function(){var url=null;try{url=ch.toBase64Image();}catch(e){}ch.destroy();try{document.body.removeChild(c);}catch(e){}res(url);},160);
  });
}
function generarReporte(){
  var p=EST.portafolios[EST.activo];if(!p)return;
  var JS=(window.jspdf&&window.jspdf.jsPDF);if(!JS){alert('No se pudo cargar el generador de PDF.');return;}
  document.getElementById('repStatus').textContent='Generando…';
  var D=divisaVista,C=calcular(p),T=totales(C,D);
  var serie=serieValor(p,D),per=filtrarPeriodo(serie);
  var v0=per.length?per[0].valor:null,v1=per.length?per[per.length-1].valor:null,ch=(v0&&v1)?(v1/v0-1)*100:null;
  var ini=per.length?per[0].fecha:'0000-00-00';
  var bS=HIST.serie&&HIST.serie[BENCH.sym]?HIST.serie[BENCH.sym]:null,benchPct=null,dif=null;
  if(bS&&per.length){var b0=cierre(bS,ini),bl=cierre(bS,per[per.length-1].fecha);if(b0&&bl){benchPct=(bl/b0-1)*100;if(ch!=null)dif=ch-benchPct;}}
  var deposito=0;(p.flujos||[]).forEach(function(f){if(f.fecha>=ini){var m=conv(f.monto,f.divisa||'USD',D);if(m!=null)deposito+=m;}});
  var divAnual=pasivo(C,D);
  var lblEje=per.map(function(x){return x.fecha;}),datEje=per.map(function(x){return x.valor;});
  var cfgLine={type:'line',data:{labels:lblEje,datasets:[{data:datEje,borderColor:'#3e6089',backgroundColor:'rgba(62,96,137,.15)',fill:true,borderWidth:2,pointRadius:0,tension:.2}]},options:{animation:false,responsive:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#555',maxTicksLimit:8}},y:{ticks:{color:'#555'}}}}};
  var mapAct=agrupar(C,D,'activo'),lblA=Object.keys(mapAct).sort(function(a,b){return mapAct[b]-mapAct[a];}),datA=lblA.map(function(l){return mapAct[l];});
  var cfgDon={type:'doughnut',data:{labels:lblA,datasets:[{data:datA,backgroundColor:PAL,borderColor:'#fff',borderWidth:1}]},options:{animation:false,responsive:false,cutout:'58%',plugins:{legend:{position:'right',labels:{color:'#333',font:{size:11}}}}}};
  Promise.all([per.length?chartImagen(cfgLine,900,300):Promise.resolve(null),lblA.length?chartImagen(cfgDon,760,340):Promise.resolve(null)]).then(function(imgs){
    var doc=new JS({unit:'pt',format:'a4'}),M=48,y=54,W=595;
    doc.setFont('helvetica','bold');doc.setFontSize(20);doc.setTextColor('#0a1f2b');doc.text('Reporte de portafolio',M,y);
    doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor('#6b869b');
    y+=20;doc.text(p.nombre+'  ·  Periodo '+PERIODO+'  ·  Moneda '+D,M,y);
    y+=14;doc.text('Generado el '+new Date().toLocaleString('es-MX'),M,y);
    doc.setDrawColor('#d0d7de');y+=12;doc.line(M,y,W-M,y);
    function fila(et,val,color){doc.setTextColor('#57606a');doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text(et,M,y);doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(color||'#111827');doc.text(String(val),W-M,y,{align:'right'});y+=22;}
    y+=26;
    fila('Valor de mercado',money(T.vm,D));
    fila('Costo invertido',money(T.co,D));
    fila('P&L no realizado',money(T.nr,D)+'  ('+pctTxt(T.pct)+')',T.nr>=0?'#1a7f37':'#cf222e');
    fila('P&L realizado (total)',money(T.re,D),T.re>=0?'#1a7f37':'#cf222e');
    fila('Rendimiento del periodo',ch!=null?pctTxt(ch):'sin histórico',ch!=null?(ch>=0?'#1a7f37':'#cf222e'):'#111827');
    if(benchPct!=null)fila('vs '+BENCH.label,pctTxt(dif)+'  (bench '+pctTxt(benchPct)+')',dif>=0?'#1a7f37':'#cf222e');
    fila('Dinero depositado en el periodo',money(deposito,D));
    fila('Dividendo anual estimado',money(divAnual,D),'#1a7f37');
    if(imgs[0]){y+=10;doc.setTextColor('#57606a');doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text('Valor del portafolio',M,y);y+=8;doc.addImage(imgs[0],'PNG',M,y,W-2*M,(W-2*M)*300/900);y+=(W-2*M)*300/900+18;}
    if(imgs[1]){if(y>560){doc.addPage();y=54;}doc.setTextColor('#57606a');doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text('Distribución por activo',M,y);y+=8;doc.addImage(imgs[1],'PNG',M,y,W-2*M,(W-2*M)*340/760);}
    doc.save('Reporte_'+p.nombre.replace(/\s+/g,'_')+'_'+PERIODO+'.pdf');
    document.getElementById('repStatus').textContent='Listo ✓';
  }).catch(function(e){document.getElementById('repStatus').textContent='Error: '+e.message;});
}

/* ═════════════ ORDENAMIENTO / ESTADO / UTILS ═════════════ */
function th(label,key,st,which){return '<th class="'+(st.k===key?'sorted':'')+'" onclick="setSort(\''+which+'\',\''+key+'\')">'+label+(st.k===key?(st.d>0?' ↑':' ↓'):'')+'</th>';}
function setSort(which,key){var st=which==='or'?sortOr:sortAb;if(!key)return;if(st.k===key)st.d*=-1;else{st.k=key;st.d=1;}render();}
function sorter(st){return function(a,b){var x=a[st.k],y=b[st.k];if(x==null)x=-Infinity;if(y==null)y=-Infinity;if(typeof x==='string')return x<y?-1*st.d:x>y?st.d:0;return (x-y)*st.d;};}
function pintarEstadoPrecios(){if(!PRECIOS.epoch){setPx('warn','sin precios aún');return;}var min=Math.round((Date.now()-PRECIOS.epoch)/60000);if(min<20)setPx('ok','precios '+min+'m');else if(min<60)setPx('warn','precios '+min+'m');else setPx('old','precios '+min+'m');}
function setPx(s,t){var d=document.getElementById('pxDot'),l=document.getElementById('pxTxt');if(d)d.className='dot '+s;if(l)l.textContent=t;}
function fmt(n){return(typeof n==='number'&&isFinite(n))?n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}):(n==null?'—':n);}
function money(n,d){if(n==null||!isFinite(n))return'—';return n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+d;}
function pctTxt(p){if(p==null||!isFinite(p))return'—';return(p>=0?'+':'')+p.toFixed(2)+'%';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function banner(m){var b=document.getElementById('banner');if(!b)return;b.textContent=m;b.classList.remove('hidden');}
function hideBanner(){var b=document.getElementById('banner');if(b)b.classList.add('hidden');}

/* Config page necesita pintar la tabla de órdenes tras render */
var _origRender=render;
render=function(){_origRender();if(PAGE==='tools'&&TOOL==='config'){var p=EST.portafolios[EST.activo];if(p)renderOrdenes((p.ordenes||[]).slice());}};

</script>
